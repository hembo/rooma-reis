/* Layout: sticky header with five tabs (four days + trip info); one day at a time as a plain timeline, times in a mono column, map links on each stop. */
:root {
  --bg: #F1F3EF;

  --ink: #15201C;
  --muted: #52615B;
  --line: #D3D9D1;
  --accent: #0B6657;
  --on-accent: #FFFFFF;
  --accent-soft: #DCEAE5;
  --warn: #7A4E00;
  --warn-bg: #FAEFD6;
  --warn-line: #E6CF9A;
  --font-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --font-body: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1614; --surface: #18221F; --ink: #E8EEEA; --muted: #9AA9A2; --line: #2A3833;
    --accent: #5FC2AB; --on-accent: #06201A; --accent-soft: #1A3A33;
    --warn: #F0C26B; --warn-bg: #33290F; --warn-line: #5C4818;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1614; --surface: #18221F; --ink: #E8EEEA; --muted: #9AA9A2; --line: #2A3833;
  --accent: #5FC2AB; --on-accent: #06201A; --accent-soft: #1A3A33;
  --warn: #F0C26B; --warn-bg: #33290F; --warn-line: #5C4818;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.45; padding-bottom: 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 42rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 10px 6px; }
.brand { font-family: var(--font-display); font-weight: 700; letter-spacing: .2em; font-size: .95rem; }
.dates { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding-block: 0 8px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 48px; padding: 6px 2px; border-radius: 8px; text-decoration: none; color: var(--muted); }
.tab span { font-size: .72rem; }
.tab b { font-family: var(--font-mono); font-weight: 500; font-size: .95rem; }
.tab[aria-current="page"] { background: var(--accent); color: var(--on-accent); }

main { padding-block: 22px 0; }
.eyebrow { font-family: var(--font-mono); font-size: .82rem; color: var(--muted); margin: 0 0 6px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.today { background: var(--accent); color: var(--on-accent); border-radius: 4px; padding: 1px 7px; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 8vw, 2.6rem); letter-spacing: .04em; line-height: 1.1; margin: 0 0 10px; text-wrap: balance; }
.lead { margin: 0 0 18px; color: var(--muted); max-width: 36rem; }
.note { margin: 0 0 18px; padding: 10px 12px; background: var(--accent-soft); border-radius: 8px; font-size: .95rem; }

.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 3.6rem minmax(0, 1fr); column-gap: 12px; padding: 15px 0; border-top: 1px solid var(--line); }
.tl li:last-child { border-bottom: 1px solid var(--line); }
.time { font-family: var(--font-mono); font-size: .95rem; color: var(--accent); font-variant-numeric: tabular-nums; padding-top: 2px; }
.what { font-weight: 600; overflow-wrap: anywhere; }
.opt { font-size: .7rem; font-weight: 400; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }
.det { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }
.check { margin: 8px 0 0; padding: 9px 12px; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); border-radius: 8px; font-size: .92rem; }
.check strong { text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; margin-right: 4px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--accent); font: inherit; font-size: .92rem; font-weight: 600; text-decoration: none; cursor: pointer; }

h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: .14em; text-transform: uppercase; margin: 30px 0 10px; }
h2:first-of-type { margin-top: 0; }
.kv { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 8px 12px; margin: 0; }
.kv dt { color: var(--muted); font-size: .92rem; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-size: .92rem; font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--line); }
.list li:last-child { border-bottom: 1px solid var(--line); }
.list label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; min-height: 48px; cursor: pointer; }
.list input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.list input:checked + span { color: var(--muted); text-decoration: line-through; }
.src { font-size: .92rem; color: var(--muted); padding-left: 1.1rem; margin: 0; }
.src li { margin-bottom: 6px; }
.src a { color: var(--accent); }
footer { margin-top: 30px; font-size: .85rem; color: var(--muted); }
.map { height: 300px; margin: 0 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--accent-soft); position: relative; z-index: 0; isolation: isolate; }
.cap { margin: 0 0 18px; font-size: .82rem; color: var(--muted); }
.leaflet-container { font-family: var(--font-body); }
.pin { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font: 500 .85rem var(--font-mono); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.pin.opt { background: #7d8883; color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); } }
:root[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

    [['Nimi', 'Bob W Rome San Lorenzo (Sonder San Lorenzo Apartments)'], ['Aadress', 'Via dei Reti 25, 00185 Roma'], ['Check-in', '15:00–00:00'], ['Check-out', 'kuni 11:00'], ['Kuhu', 'Tramm Reti peatus 1 min, Termini 25 min jalgsi']].forEach(function (r) {
      hl.appendChild(el('dt', null, r[0])); hl.appendChild(el('dd', r[0] === 'Check-in' || r[0] === 'Check-out' ? 'mono' : null, r[1]));
    });
    f.appendChild(hl);
    var acts = el('div', 'acts');

    acts.appendChild(ext('Juhised', go(HOTEL)));
    var cb = el('button', 'btn', 'Kopeeri aadress'); cb.type = 'button';
    cb.addEventListener('click', function () { copyText('Via dei Reti 25, 00185 Roma', cb); });

    f.appendChild(el('h2', null, 'Enne reisi'));

    CHECKS.forEach(function (txt, i) {
      var li = el('li'); var lab = el('label'); var inp = el('input'); inp.type = 'checkbox'; inp.id = 'chk' + i; inp.checked = !!checked[i];
      inp.addEventListener('change', function () { if (inp.checked) checked[i] = 1; else delete checked[i]; saveChecks(); });
      lab.appendChild(inp); lab.appendChild(el('span', null, txt)); li.appendChild(lab); ul.appendChild(li);
    });

     'Vatikani muuseumid on pühapäeval ja 1. novembril suletud. Campo de’ Fiori turg on pühapäeval suletud.',

    ].forEach(function (t) { tips.appendChild(el('li', null, t)); });

  var map = null;
  function drawMap(day, host) {
    var cap = host.nextSibling;
    function hide() { host.hidden = true; if (cap) cap.hidden = true; }
    if (typeof L === 'undefined') { hide(); return; }
    var pts = [], seen = {};
    day.items.forEach(function (it) {
      var c = it.p === HOTEL ? HOTELLL : LLS[it.p];
      if (!c) return;
      var k = c.join(',');
      if (seen[k]) return;
      seen[k] = 1;
      pts.push({ c: c, it: it });
    });
    if (!pts.length) { hide(); return; }
    map = L.map(host, { scrollWheelZoom: false });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
    var n = 0, line = [], all = [];
    pts.forEach(function (p) {
      var opt = !!p.it.opt;
      if (!opt) { n++; line.push(p.c); }
      all.push(p.c);
      var icon = L.divIcon({ className: 'pin' + (opt ? ' opt' : ''), html: opt ? '+' : String(n), iconSize: [30, 30], iconAnchor: [15, 15] });
      var pop = document.createElement('div');
      pop.textContent = p.it.t + '  ' + p.it.w;
      L.marker(p.c, { icon: icon, title: p.it.w }).addTo(map).bindPopup(pop);
    });
    if (line.length > 1) L.polyline(line, { color: '#17917a', weight: 3, dashArray: '6 8' }).addTo(map);
    map.fitBounds(L.latLngBounds(all), { padding: [34, 34], maxZoom: 15 });
  }

  var view = document.getElementById('view');
  function show() {
    var id = (location.hash || '').slice(1);
    if (ORDER.indexOf(id) < 0) {
      id = 'reede';
      ORDER.forEach(function (k) { if (DAYS[k] && DAYS[k].date === todayStr()) id = k; });
    }
    if (map) { map.remove(); map = null; }
    view.textContent = '';
    view.appendChild(id === 'reis' ? renderInfo() : renderDay(DAYS[id]));
    if (id !== 'reis') drawMap(DAYS[id], view.querySelector('.map'));
    Array.prototype.forEach.call(tabs.children, function (a) {
      if (a.dataset.id === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show);
  show();
})();
</script>
